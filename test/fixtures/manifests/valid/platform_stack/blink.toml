[blink]
version = "1"

[targets.local]
type = "local"
base = "/tmp/blink-platform-stack"

[targets.local.env]
BEARCLAW_TOKEN = "${BLINK_BEARCLAW_TOKEN}"

[services.fixture-tardigrade]
description = "Tardigrade edge gateway fixture"
health_base = "http://127.0.0.1:__PORT__"

[services.fixture-tardigrade.source]
type = "local_build"
workdir = "."
command = "mkdir -p bin && cp artifacts/tardigrade.bin bin/tardigrade"
artifact = "bin/tardigrade"

[services.fixture-tardigrade.deploy]
target = "local"
priority = 20
pipeline = ["fetch_artifact", "verify"]
rollback_pipeline = ["stop", "start"]

[services.fixture-tardigrade.health_check]
url = "{{health_base}}/fixture-tardigrade/health"

[services.fixture-tardigrade.verify.tests.binary]
type = "shell"
command = "test -f bin/tardigrade && echo ok"
expect_output = "ok"
tags = ["smoke"]

[services.fixture-tardigrade.stop]
command = "true"

[services.fixture-tardigrade.start]
command = "true"

[services.fixture-bearclaw]
description = "BearClaw gateway fixture"
health_base = "http://127.0.0.1:__PORT__"

[services.fixture-bearclaw.source]
type = "local_build"
workdir = "."
command = "mkdir -p bin && cp artifacts/bearclaw.bin bin/bearclaw"
artifact = "bin/bearclaw"

[services.fixture-bearclaw.deploy]
target = "local"
priority = 10
pipeline = ["fetch_artifact", "verify"]
rollback_pipeline = ["stop", "start"]

[services.fixture-bearclaw.health_check]
url = "{{health_base}}/fixture-bearclaw/health"

[services.fixture-bearclaw.verify.tests.binary]
type = "shell"
command = "test -f bin/bearclaw && echo ok"
expect_output = "ok"
tags = ["smoke"]

[services.fixture-bearclaw.stop]
command = "true"

[services.fixture-bearclaw.start]
command = "true"
